<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.5 和 0.75 语速试听比较</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#1b2940;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 64px}h1{font-size:30px;line-height:1.4}.sub{font-size:19px;line-height:1.7;color:#53647d}.card{background:#fff;border-radius:20px;padding:23px;margin:16px 0;box-shadow:0 4px 20px #182d500f}.english{font-size:30px;color:#1d64aa;font-weight:800}.pron{font-size:26px;color:#a2482f;margin:10px 0}.zh{font-size:24px}.card h2{font-size:27px}button{width:100%;background:#1d64aa;color:#fff;border:0;border-radius:14px;padding:18px;font-size:23px;font-weight:800;min-height:62px}button:focus-visible{outline:3px solid #a2482f;outline-offset:3px}a{color:#1d64aa;font-weight:700}#status{font-size:19px;line-height:1.6}</style></head><body><main><a href="course.html">← 返回全年课程总览</a><h1>0.5 和 0.75 语速试听比较</h1><div class="sub">同一句英文、同一位 Kokoro af_heart 美式女声。两段都是独立生成的真实 MP3，不是手机播放速度调整。</div><section class="card"><div class="english">Thank you very much!</div><div class="pron">三克优，维瑞 马奇</div><div class="zh">非常感谢你！</div></section><section class="card"><h2>语速 0.75 · 慢速</h2><p class="sub">适合日常听读和熟悉自然语调。</p><button data-file="audio/compare_thank_you_very_much_075.mp3" type="button">▶ 播放 0.75 语速</button></section><section class="card"><h2>语速 0.5 · 超慢速</h2><p class="sub">适合初学者逐词听清、跟读模仿。</p><button data-file="audio/compare_thank_you_very_much_05.mp3" type="button">▶ 播放 0.5 语速</button></section><div class="card"><div id="status" role="status" aria-live="polite">点击按钮试听。建议先听 0.75，再听 0.5。</div></div><a href="course.html">返回全年课程总览</a></main><audio id="player" preload="none"></audio><script>(function(){var player=document.getElementById('player'),status=document.getElementById('status'),id=0;document.querySelectorAll('[data-file]').forEach(function(b){b.addEventListener('click',function(){var current=++id;player.pause();player.src=b.dataset.file;status.textContent='正在播放：'+b.textContent.replace('▶ 播放 ','');var p=player.play();if(p&&p.catch)p.catch(function(){if(current===id)status.textContent='播放失败，请检查网络并重试。'});})});player.addEventListener('ended',function(){status.textContent='播放完毕，可以点击另一种语速继续比较。'});player.addEventListener('error',function(){status.textContent='音频加载失败，请稍后重试。'});})();</script></body></html>
