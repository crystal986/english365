name: Generate Day 1 Kokoro AI audio
on:
  workflow_dispatch:
  push:
    branches:
      - feat/day1-kokoro-audio
    paths:
      - .github/workflows/generate-day1-audio.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install open-source Kokoro
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r tools/requirements-kokoro.txt
          python -m pip check
      - name: Generate and validate MP3s
        run: python tools/generate_day1.py
      - name: Upload validated MP3s, report and upgraded lesson
        uses: actions/upload-artifact@v4
        with:
          name: day1-kokoro-af-heart-mp3
          path: |
            audio/*.mp3
            audio/validation.json
            index.html
          if-no-files-found: error
