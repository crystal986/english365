name: Weekly course production gate
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number (3-53); never merge automatically"
        required: true
        type: number
permissions:
  contents: read
  issues: write
jobs:
  plan-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate approved plan and select next week
        env:
          WEEK: ${{ inputs.week }}
        run: python scripts/weekly_production_gate.py > selected-week.json
      - uses: actions/upload-artifact@v4
        with:
          name: selected-week
          path: selected-week.json
      - name: Explicit non-merge safety notice
        run: |
          echo 'This workflow only validates a week selection.'
          echo 'It never creates finished courses, MP3s, previews or merges.'
          echo 'A separate content/audio/preview pipeline is required.'
